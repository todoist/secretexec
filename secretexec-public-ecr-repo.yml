Description: Manages secretexec public ECR repository
Resources:
  Repository:
    Type: AWS::ECR::PublicRepository
    Properties:
      RepositoryName: doist/secretexec
  GithubRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:todoist/secretexec:ref:refs/heads/main'
                  - !Sub 'repo:todoist@2565372/secretexec@1167707496:ref:refs/heads/main'
                  - !Sub 'repo:todoist/secretexec:ref:refs/tags/v*'
                  - !Sub 'repo:todoist@2565372/secretexec@1167707496:ref:refs/tags/v*'
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicPowerUser']
